name: Build Public Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Public Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          else
            cd android
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
            cd ..
          fi

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/CreatorProRecorder-v1.0.0.apk
          echo "APK successfully created at build-output/CreatorProRecorder-v1.0.0.apk"

      - name: Upload Public APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreatorProRecorder-APK
          path: build-output/CreatorProRecorder-v1.0.0.apk
          retention-days: 90

      - name: Publish Public GitHub Release (on tag or manual)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/CreatorProRecorder-v1.0.0.apk
          name: "Creator Pro Recorder Release ${{ github.ref_name }}"
          body: |
            ## 🚀 Creator Pro Recorder — Public APK Release
            
            Download and install the latest standalone Android screen recording app.
            
            ### ✨ Features:
            - 100% Offline & Private (Zero Ads, Zero Tracking)
            - 1080p / 4K 60-120fps Screen Capture via MediaProjection
            - Custom Drag-to-Crop Region Recording
            - Internal System Audio + Microphone Dual Track Mixing
            - Front-Camera Facecam Floating Bubble
            - In-App Video Trimmer & Timeline Scrubber
            - 6 Premium Color Themes & Jetpack Compose Design System
            
            ### 📥 Installation:
            1. Download `CreatorProRecorder-v1.0.0.apk` below.
            2. On your Android phone, tap the downloaded APK to install.
            3. Grant Screen Recording & Audio permissions when prompted.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
