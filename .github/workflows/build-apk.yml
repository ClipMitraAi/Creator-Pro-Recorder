name: Build Public Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Public Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK & Accept Licenses
        run: |
          # Ensure local.properties points to the runner's Android SDK
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

          # Accept all SDK licenses automatically
          yes | sdkmanager --licenses || true

          # Install required Android 15 (API 35) platform and build tools
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Wrapper and Build Android Debug APK
        working-directory: ./android
        run: |
          # Generate wrapper if missing
          gradle wrapper --gradle-version 8.7 || true
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/CreatorProRecorder-v1.0.0.apk
          ls -lh build-output/CreatorProRecorder-v1.0.0.apk
          echo "APK successfully compiled at build-output/CreatorProRecorder-v1.0.0.apk"

      - name: Upload Public APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreatorProRecorder-APK
          path: build-output/CreatorProRecorder-v1.0.0.apk
          retention-days: 90

      - name: Publish Public GitHub Release (on Tag or Manual Run)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/CreatorProRecorder-v1.0.0.apk
          name: "Creator Pro Recorder Release ${{ github.ref_name || 'v1.0.0' }}"
          body: |
            ## 🚀 Creator Pro Recorder — Public Android APK
            
            Download and install the standalone, 100% private Android screen recording app.
            
            ### ✨ Features:
            - **Zero Ads & Zero Tracking**: 100% offline-first. Video/Audio never leaves your phone.
            - **1080p / 4K Capture**: High-framerate (60-120 FPS) screen capture via Android MediaProjection.
            - **Custom Area Crop**: Interactive drag-and-crop region recording (9:16 Shorts, 16:9, 1:1, etc.).
            - **Internal Sound + Microphone**: Simultaneous dual-channel audio mixing with live decibel meters.
            - **Floating Facecam Bubble**: Front camera overlay with custom shapes (Circle, Rounded, Square).
            - **In-App Video Trimmer**: Scrub, cut, and export clips directly to your phone storage.
            
            ### 📥 Installation Steps:
            1. Download `CreatorProRecorder-v1.0.0.apk` below.
            2. On your Android phone, tap the file to install (allow "Install from unknown sources" if prompted).
            3. Open **Creator Pro Recorder** and grant screen & audio permissions to record!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
